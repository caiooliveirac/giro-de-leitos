name: Configure WhatsApp group

# Liga os avisos endereçados ao GRUPO das UPAs escrevendo no .deploy-env do
# servidor — arquivo que o `docker run --env-file` lê e que, por não ser
# versionado, nenhum push alcança.
#
# Descobre sozinho as duas coisas que não estão no .deploy-env:
#   • o JID do grupo  → unit systemd do giro-wa-adapter, ou o journal dele
#                       (o grupo de onde os giros realmente chegam);
#   • a credencial do gateway → APP_BASIC_AUTH do container whatsmeow.
#
# NÃO recria o container. Depois de aplicar, rode o workflow "Deploy" com
# component=api, que tem canary, healthcheck e rollback.
#
# CUIDADO — este repositório é PÚBLICO, e os logs do Actions também. Nada aqui
# imprime o conteúdo do .deploy-env nem a credencial do gateway.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect = só relata · apply = grava"
        required: true
        type: choice
        options: [inspect, apply]
        default: inspect
      group_jid:
        description: "JID do grupo (vazio = descobrir no servidor)"
        required: false
        type: string
        default: ""

concurrency:
  group: giro-de-leitos-deploy
  cancel-in-progress: false

jobs:
  configure:
    name: Configure (.deploy-env)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.PROD_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Configure group alerts
        env:
          MODE: ${{ inputs.mode }}
          JID_IN: ${{ inputs.group_jid }}
        run: |
          ssh -o ServerAliveInterval=20 -i ~/.ssh/id_ed25519 \
              ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} \
              MODE="$MODE" JID_IN="$JID_IN" bash -s << 'REMOTE_SCRIPT'
            set -euo pipefail
            F=/home/ubuntu/giro-de-leitos/.deploy-env

            if [ ! -f "$F" ]; then
              echo "ERRO: $F nao existe nesta maquina."
              echo "O giro-de-leitos roda em outro host? Confira PROD_SSH_HOST."
              exit 1
            fi

            # Mostra so o suficiente para conferir identidade: log publico.
            mask() {
              v="${1:-}"
              [ -z "$v" ] && { echo "(vazio)"; return; }
              [ "${#v}" -le 10 ] && { echo "***"; return; }
              echo "***${v: -10}"
            }
            # Le UMA chave sem dar `source`: .deploy-env e formato --env-file
            # (KEY=VALUE literal), nao script shell valido.
            get() {
              grep -E "^$1=" "$F" 2>/dev/null | tail -1 | cut -d= -f2- | tr -d '\r' || true
            }

            # --- 1. Gateway whatsmeow (outro container, env proprio) ---------
            GA="$(get WHATSAPP_GW_AUTH)"
            GU="$(get WHATSAPP_GW_URL)"
            GS=".deploy-env"
            if [ -z "$GA" ]; then
              C="$(docker ps --format '{{.Names}} {{.Image}}' 2>/dev/null \
                   | grep -iE 'whatsapp-web-multidevice|whatsmeow' | awk '{print $1}')"
              N="$(printf '%s' "$C" | grep -c . || true)"
              if [ "$N" = "1" ]; then
                GA="$(docker inspect "$C" \
                      --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null \
                      | grep '^APP_BASIC_AUTH=' | head -1 | cut -d= -f2- || true)"
                GS="container $C"
              else
                GS="INDETERMINADO ($N containers de gateway)"
              fi
            fi
            [ -z "$GU" ] && GU="http://host.docker.internal:3080"

            # --- 2. Qual grupo? ----------------------------------------------
            # Nunca adivinhar: transmitir para o grupo errado nao tem desfazer.
            J="${JID_IN:-}"
            JS="input do workflow"
            if [ -z "$J" ]; then
              J="$(get WHATSAPP_GROUP_TO)"
              [ -n "$J" ] && JS="WHATSAPP_GROUP_TO ja existente"
            fi
            if [ -z "$J" ]; then
              J="$(systemctl cat giro-wa-adapter 2>/dev/null \
                   | grep -oE 'GIRO_GROUP_JID=[^"[:space:]]+' | head -1 | cut -d= -f2- || true)"
              [ -n "$J" ] && JS="unit systemd do giro-wa-adapter"
            fi
            if [ -z "$J" ]; then
              # Fonte mais confiavel quando o adapter esta em modo descoberta:
              # o grupo de onde os giros REALMENTE chegaram.
              J="$(journalctl -u giro-wa-adapter -n 500 --no-pager 2>/dev/null \
                   | grep -oE 'chat=[0-9-]+@g\.us' | cut -d= -f2 \
                   | sort | uniq -c | sort -rn | head -1 | awk '{print $2}' || true)"
              [ -n "$J" ] && JS="journal do adapter (grupo de onde o giro chega)"
            fi

            echo "=== descoberta ==="
            echo "  gateway: auth=$([ -n "$GA" ] && echo presente || echo AUSENTE)  [$GS]"
            echo "  grupo:   $(mask "$J")  [${JS}]"

            if [ -z "$J" ]; then
              echo ""
              echo "ERRO: nao consegui determinar o JID do grupo."
              echo "Rode de novo preenchendo o input group_jid."
              exit 1
            fi
            case "$J" in
              *@g.us) ;;
              *) echo "ERRO: nao parece JID de grupo (esperado ...@g.us)"; exit 1 ;;
            esac
            if [ -z "$GA" ]; then
              echo ""
              echo "ERRO: sem credencial do gateway. Ligar os avisos agora criaria"
              echo "um canal mudo — nada chegaria no grupo. Preencha"
              echo "WHATSAPP_GW_AUTH no .deploy-env e rode de novo."
              exit 1
            fi

            # --- 3. O gateway responde? --------------------------------------
            # A sessao do WhatsApp pode ter expirado e estar pedindo QR novo.
            U="$(printf '%s' "$GU" | sed 's|host.docker.internal|127.0.0.1|')"
            if curl -fsS -u "$GA" "${U%/}/user/my/groups" -o /dev/null 2>/dev/null; then
              echo "  gateway responde: OK"
            else
              echo "  gateway responde: NAO (em $U)"
              echo "  AVISO: a sessao do WhatsApp pode precisar de QR code novo."
              echo "  A config sera gravada, mas os envios vao falhar ate isso ser resolvido."
            fi

            if [ "$MODE" != "apply" ]; then
              echo ""
              echo "modo inspect — NADA foi alterado."
              echo "Rode de novo com mode=apply para gravar."
              exit 0
            fi

            # --- 4. Gravar ---------------------------------------------------
            B="$F.bak-$(date +%Y%m%d-%H%M%S)"
            cp -p "$F" "$B"
            chmod 600 "$B"
            echo ""
            echo "backup: $(basename "$B")"

            # Idempotente: remove todas as ocorrencias e reescreve uma so.
            set_kv() {
              t="$(mktemp)"
              grep -vE "^$1=" "$F" > "$t" || true
              printf '%s=%s\n' "$1" "$2" >> "$t"
              cat "$t" > "$F"
              rm -f "$t"
            }

            set_kv WHATSAPP_GW_AUTH "$GA"
            set_kv WHATSAPP_GW_URL "$GU"
            set_kv WHATSAPP_GROUP_TO "$J"
            set_kv WHATSAPP_RESTRICTION_ENABLED true
            set_kv TABELA_RESTRICTIONS_URL https://mnrs.com.br/tabela/api/upas/restrictions
            set_kv WHATSAPP_RESTRICTION_DIGEST_HOURS 4
            set_kv WHATSAPP_RESTRICTION_POLL_MINUTES 2
            set_kv WHATSAPP_ALERT_ENABLED true
            set_kv WHATSAPP_ALERT_TO_GROUP true
            chmod 600 "$F"

            echo ""
            echo "=== gravado ==="
            for k in WHATSAPP_GROUP_TO WHATSAPP_RESTRICTION_ENABLED \
                     WHATSAPP_RESTRICTION_DIGEST_HOURS WHATSAPP_RESTRICTION_POLL_MINUTES \
                     WHATSAPP_ALERT_ENABLED WHATSAPP_ALERT_TO_GROUP; do
              v="$(get "$k")"
              case "$k" in
                *GROUP_TO) echo "  $k = $(mask "$v")" ;;
                *) echo "  $k = ${v:-(vazio)}" ;;
              esac
            done
            echo "  WHATSAPP_GW_AUTH = (gravado, nao exibido)"

            echo ""
            echo "PROXIMO PASSO: rode o workflow 'Deploy' com component=api."
            echo "O .deploy-env so e lido no docker run — o container atual"
            echo "continua com a config antiga ate ser recriado."
          REMOTE_SCRIPT

name: Deploy

# Deploy no servidor magalu (docker: api + frontend), sem SSH e sem runner no Mac:
#
#   1. aqui, na VM do GitHub: testes (pytest + tsc) do commit da main;
#   2. verde: move a branch `live` para esse SHA (só avança, fast-forward);
#   3. no servidor: o auto-promote.timer (a cada minuto) vê a `live` andar e
#      roda `labctl promote giro-de-leitos <sha>` → scripts/deploy-magalu.sh do
#      próprio commit (rsync, backup, build, canary, swap; falhou antes do
#      swap, a produção nem é tocada; falhou depois, volta sozinha);
#   4. aqui: espera o /api/health público responder com esse SHA.
#
# Funciona de qualquer aparelho: merge/push na main pelo celular basta.

on:
  push:
    branches: [main]
  # Revalida e libera a ponta da main de novo (ex.: a `live` não andou).
  workflow_dispatch:

concurrency:
  group: giro-de-leitos-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test (backend + frontend typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          pip install pytest httpx eval_type_backport
      - name: Run backend tests
        run: pytest tests/ -q

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck
        working-directory: frontend
        run: pnpm exec tsc --noEmit

  liberar:
    name: Liberar para o LIVE (branch live)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      # Pela API: o GitHub confere o fast-forward do lado dele (re-run de um
      # run antigo não faz a live voltar; rollback é revert na main).
      - name: Mover a live para o SHA testado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/live" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/live" \
              -f sha="${GITHUB_SHA}" -F force=false >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref=refs/heads/live -f sha="${GITHUB_SHA}" >/dev/null
          fi
          echo "live -> ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

  aguardar:
    name: Esperar o servidor publicar
    needs: liberar
    runs-on: ubuntu-latest
    # Timer de 1 min + build das duas imagens (~3–6 min) + fila de outros apps.
    timeout-minutes: 30
    steps:
      - name: /api/health público com o SHA novo
        run: |
          set -u
          url=https://giro.mnrs.com.br/api/health
          while true; do
            no_ar="$(curl -fsS -m 10 "${url}" | jq -r '.commit // empty' 2>/dev/null || true)"
            if [ "${no_ar}" = "${GITHUB_SHA}" ]; then
              echo "No ar: ${no_ar}"
              break
            fi
            echo "Ainda em ${no_ar:-?}; esperando ${GITHUB_SHA:0:7}..."
            sleep 20
          done
          # O frontend troca segundos depois da api, no mesmo deploy.
          sleep 30
          curl -fsS -m 10 -o /dev/null https://giro.mnrs.com.br/ && echo "Frontend OK"

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Deploy giro.mnrs.com.br (magalu/docker, auto-promote)"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Público: https://giro.mnrs.com.br/api/health"
            echo "- Se não publicou: \`ssh magalu journalctl -u auto-promote -n 80\` e \`labctl history giro-de-leitos\`"
          } >> "$GITHUB_STEP_SUMMARY"
